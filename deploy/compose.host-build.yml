# =============================================================================
# 宿主机构建前端 override（路径 B：host-build）
#
# 适用：服务器资源紧张不想跑 node 镜像 / 前端已在本机 `npm run build` 出 dist。
# 用法：
#   cd frontend && npm ci && npm run build        # 产出 frontend/dist
#   cd ..
#   docker compose --project-name gold-desire --env-file .env \
#     -f deploy/docker-compose.yml \
#     -f deploy/compose.host-build.yml up -d
#
# 需要 Docker Compose v2.24+（!reset 标签）；老版本请直接编辑主文件的 nginx 服务。
# =============================================================================
services:
  nginx:
    # 取消镜像构建，改用官方 nginx 直接托管宿主机 dist/
    build: !reset null
    image: nginx:1.27-alpine
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
