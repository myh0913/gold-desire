# =============================================================================
# gold-desire nginx 站点配置（由 compose 挂载为 /etc/nginx/conf.d/default.conf，
# 直接覆盖镜像自带默认站点）
#
# 本文件位于 http{} 上下文内（nginx:alpine 主配置 include conf.d/*.conf）。
# 职责：
#   - 前端 SPA 静态托管（/usr/share/nginx/html，构建产物来自 frontend/Dockerfile
#     或宿主机 dist 挂载，见 deploy/compose.host-build.yml）
#   - /api/ 反代 api:8000（后端路由自带 /api 前缀，不做 rewrite）
#   - /api/agent/ SSE 透传（关闭缓冲，长读超时）
#   - /ws WebSocket 反代（Upgrade/Connection 头 + 长读超时）
#   - /health /ready 探针透传（供宿主机/LB 探测整条链路）
#   - gzip / 安全响应头（与应用层中间件双层防御） / SPA fallback
#
# 注意：缓存控制一律用 `expires` 指令而非 location 级 add_header——
# nginx 的 add_header 不跨层级继承，location 内一旦出现 add_header 就会丢弃
# server 级的全部安全响应头。
#
# 完整 `nginx -t` 校验需在服务器上执行（本文件为静态交付）。
# =============================================================================

# WebSocket 升级：非 upgrade 请求保持空 Connection，避免干扰 keepalive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream gold_desire_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ------------------------------------------------------------------ 基础
    server_tokens off;
    client_max_body_size 10m; # 注册/表单/参数保存足够，拒绝超大包
    charset utf-8;

    root  /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------- 安全响应头（防御纵深，
    # 与 app.core.middleware 的应用层响应头保持同口径）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS 仅在 HTTPS 启用后打开（HTTP 下发 HSTS 无效且易踩坑）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ------------------------------------------------------------------ gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss image/svg+xml;

    # ------------------------------------------------------- 探针透传（整链路）
    location = /health {
        proxy_pass http://gold_desire_api;
        access_log off;
    }
    location = /ready {
        proxy_pass http://gold_desire_api;
        access_log off;
    }

    # ------------------------------------------- Agent SSE（/api/agent/**）
    # 会话为 POST text/event-stream 流式响应：必须关缓冲、拉长读超时
    location ^~ /api/agent/ {
        proxy_pass http://gold_desire_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        ""; # keepalive，勿用 upgrade
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ------------------------------------------------------------ /api/ 反代
    location /api/ {
        proxy_pass http://gold_desire_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # -------------------------------------------------------- /ws WebSocket
    location /ws {
        proxy_pass http://gold_desire_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s; # 长连接：覆盖服务端 30s 心跳的多个周期
        proxy_send_timeout 3600s;
    }

    # ------------------------------------------------------- 静态资产（带 hash）
    # Vite 产物文件名带内容 hash，可一年 immutable 缓存
    location /assets/ {
        expires 365d;
        try_files $uri =404;
    }

    # ------------------------------------------------- SPA fallback（其余路径）
    # index.html 永不缓存，保证发版即生效
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

